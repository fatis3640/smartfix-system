<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Demande</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header">
      <h3>Add Demande</h3>
    </div>

    <div class="card-body">

      <form th:action="@{/demandes/save}"
            th:object="${demande}"
            method="post">

        <div class="mb-3">
          <label class="form-label">
            Description
          </label>

          <input type="text"
                 class="form-control"
                 th:field="*{description}"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Status
          </label>

          <select class="form-select"
                  th:field="*{status}">

            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>

          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Technicien
          </label>

          <select class="form-select"
                  th:field="*{technicien}">

            <option th:each="t : ${techniciens}"
                    th:value="${t.id}"
                    th:text="${t.name}">
            </option>

          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Appareil
          </label>

          <select class="form-select"
                  th:field="*{appareil}">

            <option th:each="a : ${appareils}"
                    th:value="${a.id}"
                    th:text="${a.type + ' - ' + a.marque}">
            </option>

          </select>
        </div>

        <button type="submit"
                class="btn btn-success">
          Save
        </button>

        <a href="/demandes"
           class="btn btn-secondary">
          Back
        </a>

      </form>

    </div>

  </div>

</div>

</body>
</html>
