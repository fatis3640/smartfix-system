<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Demande</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header">
      <h3>Add Demande</h3>
    </div>

    <div class="card-body">

      <form action="/demandes/save" method="post">

        <div class="mb-3">
          <label class="form-label">Description</label>

          <input type="text"
                 name="description"
                 class="form-control"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Status</label>

          <select name="status" class="form-select">

            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>

          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Technicien</label>

          <select name="technicienId" class="form-select">

            <option value="">Select Technicien</option>

            <option th:each="t : ${techniciens}"
                    th:value="${t.id}"
                    th:text="${t.name}">
            </option>

          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Appareil</label>

          <select name="appareilId" class="form-select">

            <option value="">Select Appareil</option>

            <option th:each="a : ${appareils}"
                    th:value="${a.id}"
                    th:text="${a.type + ' - ' + a.marque}">
            </option>

          </select>
        </div>

        <button type="submit" class="btn btn-success">
          Save
        </button>

        <a href="/demandes" class="btn btn-secondary">
          Back
        </a>

      </form>

    </div>

  </div>

</div>

</body>
</html>
