<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SmartFix Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center mb-4">
        SmartFix Dashboard
    </h1>

    <div class="row">

        <div class="col-md-4 mb-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h3 th:text="${clientsCount}"></h3>
                    <p>Clients</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h3 th:text="${appareilsCount}"></h3>
                    <p>Appareils</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h3 th:text="${techniciensCount}"></h3>
                    <p>Techniciens</p>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h3 th:text="${demandesCount}"></h3>
                    <p>Demandes</p>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h3 th:text="${interventionsCount}"></h3>
                    <p>Interventions</p>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <div class="text-center">

        <a href="/clients" class="btn btn-primary m-2">
            Clients
        </a>

        <a href="/appareils" class="btn btn-success m-2">
            Appareils
        </a>

        <a href="/techniciens" class="btn btn-warning m-2">
            Techniciens
        </a>

        <a href="/demandes" class="btn btn-info m-2">
            Demandes
        </a>

        <a href="/interventions" class="btn btn-danger m-2">
            Interventions
        </a>

    </div>

</div>

</body>
</html>
