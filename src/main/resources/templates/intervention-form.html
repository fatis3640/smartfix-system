<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Intervention Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Intervention Form</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/interventions/save}"
                  th:object="${intervention}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Details</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{details}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date</label>

                    <input type="date"
                           class="form-control"
                           name="date"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Demande</label>

                    <select class="form-select"
                            name="demandeId">

                        <option th:each="d : ${demandes}"
                                th:value="${d.id}"
                                th:text="${d.description}">
                        </option>

                    </select>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save
                </button>

                <a href="/interventions"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
