<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Technicien Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Technicien Form</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/techniciens/save}"
                  th:object="${technicien}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Speciality
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{speciality}"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save
                </button>

                <a href="/techniciens"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
