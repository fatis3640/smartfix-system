<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Demandes Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Demandes Management</h1>

    <div class="mb-3">
        <a href="/demandes/add" class="btn btn-primary">
            Add Demande
        </a>

        <a href="/" class="btn btn-secondary">
            Dashboard
        </a>
    </div>

    <form action="/demandes/search"
          method="get"
          class="row g-2 mb-4">

        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="RECU">RECU</option>
                <option value="DIAGNOSTIC">DIAGNOSTIC</option>
                <option value="EN_REPARATION">EN_REPARATION</option>
                <option value="TERMINE">TERMINE</option>
                <option value="LIVRE">LIVRE</option>
            </select>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-dark">
                Search
            </button>
        </div>

    </form>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Status</th>
            <th>Technicien</th>
            <th>Appareil</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="d : ${demandes}">

            <td th:text="${d.id}"></td>

            <td th:text="${d.description}"></td>

            <td th:text="${d.status}"></td>

            <td th:text="${d.technicien != null ? d.technicien.name : '-'}"></td>

            <td th:text="${d.appareil != null ? d.appareil.type : '-'}"></td>

            <td>
                <a th:href="@{'/demandes/edit/' + ${d.id}}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{'/demandes/delete/' + ${d.id}}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
