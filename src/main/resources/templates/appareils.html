<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appareils</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="mb-4">
        Appareils Management
    </h1>

    <a href="/appareils/add"
       class="btn btn-primary mb-3">
        Add Appareil
    </a>

    <a href="/"
       class="btn btn-secondary mb-3">
        Dashboard
    </a>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Marque</th>
            <th>Client</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="a : ${appareils}">

            <td th:text="${a.id}"></td>

            <td th:text="${a.type}"></td>

            <td th:text="${a.marque}"></td>

            <td th:text="${a.client != null ? a.client.name : ''}"></td>

            <td>

                <a th:href="@{'/appareils/edit/' + ${a.id}}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{'/appareils/delete/' + ${a.id}}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
