<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Techniciens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Techniciens Management</h1>

    <a href="/techniciens/add"
       class="btn btn-primary mb-3">
        Add Technicien
    </a>

    <a href="/"
       class="btn btn-secondary mb-3">
        Dashboard
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Speciality</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="t : ${techniciens}">

            <td th:text="${t.id}"></td>

            <td th:text="${t.name}"></td>

            <td th:text="${t.speciality}"></td>

            <td>

                <a th:href="@{/techniciens/edit/{id}(id=${t.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/techniciens/delete/{id}(id=${t.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
