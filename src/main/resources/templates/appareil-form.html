<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appareil Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Appareil Form</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/appareils/save}"
                  th:object="${appareil}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">
                        Type
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{type}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Marque
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{marque}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Client
                    </label>

                    <select class="form-select"
                            th:field="*{client}">

                        <option th:each="c : ${clients}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>

                    </select>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save
                </button>

                <a href="/appareils"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
