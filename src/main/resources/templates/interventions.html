<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Interventions Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Interventions Management</h1>

    <div class="mb-3">
        <a href="/interventions/add" class="btn btn-primary">
            Add Intervention
        </a>

        <a href="/" class="btn btn-secondary">
            Dashboard
        </a>
    </div>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Details</th>
            <th>Date</th>
            <th>Demande</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="i : ${interventions}">

            <td th:text="${i.id}"></td>

            <td th:text="${i.details}"></td>

            <td th:text="${i.date}"></td>

            <td th:text="${i.demande != null ? i.demande.description : 'No Demande'}"></td>

            <td>
                <a th:href="@{/interventions/edit/{id}(id=${i.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/interventions/delete/{id}(id=${i.id})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
